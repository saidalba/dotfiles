[general]
; Day and night color temperatures
temp-day=6500
temp-night=3500

; Enable/disable smooth transition between day and night
fade=1

; Screen brightness or gamma adjustment (1.0 is default)
gamma=0.8

; Choose 'manual' or 'geoclue2' for location provider
location-provider=manual

; Use wayland adjustment method for Sway
adjustment-method=wayland

[manual]
; Change these coordinates to your latitude and longitude
lat=37.8
lon=-122.4

[wayland]
; Optional: target specific output screen, e.g., eDP-1 or leave blank for all
;output=eDP-1
